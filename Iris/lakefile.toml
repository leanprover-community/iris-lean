name = "iris"
defaultTargets = ["Iris", "IrisTest"]

[[require]]
name = "Qq"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Iris"

[[lean_lib]]
name = "IrisTest"

[[lean_exe]]
name = "dumpPortingData"
srcDir = "Iris/Std"
root = "DumpPortingData"
supportInterpreter = true

[[lean_exe]]
name = "check-imports"
srcDir = "../scripts"
root = "CheckImports"

[[lean_exe]]
name = "check-init"
srcDir = "../scripts"
root = "CheckInit"
